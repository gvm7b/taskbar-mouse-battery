[package]
name = "taskbar-mouse-battery"
version = "0.1.0"
edition = "2021"

[dependencies]
# Bindings leves da API nativa do Windows (Win32 + WinRT Power/HID)
windows = { version = "0.58", features = [
    "Devices_Enumeration",
    "Devices_Power",
    "Foundation",
    "System_Power",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Para leitura direta de pacotes HID no dongle 2.4GHz 8K do Delux M900 Pro
hidapi = "2.6"

[profile.release]
opt-level = "z"     # Otimiza para tamanho mínimo de binário
lto = true          # Link-Time Optimization
codegen-units = 1
panic = "abort"
strip = true        # Remove símbolos de debug (gera executável de ~300 KB)
